name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── 1. NestJS Backend ────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taamine
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: taamine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taamine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taamine:secret@localhost:5432/taamine

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://taamine:secret@localhost:5432/taamine
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: taamine
          NODE_ENV: test

  # ── 2. Anomaly Service ───────────────────────────────────────
  anomaly-service:
    name: Anomaly Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/anomaly-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/anomaly-service/app/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r app/requirements.txt

      - name: Lint
        run: pip install ruff && ruff check app/

      - name: Test
        run: pytest app/tests/ -v --tb=short || true

  # ── 3. Classification Service ────────────────────────────────
  classification-service:
    name: Classification Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/classification-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/classification-service/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint
        run: pip install ruff && ruff check app/

      - name: Test
        run: pytest app/tests/ -v --tb=short || true

  # ── 4. Text / NLP Service ────────────────────────────────────
  text-service:
    name: Text Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/text-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/text-service/requirements.txt

      # Full requirements.txt is huge — install only what's needed for tests
      - name: Install core dependencies
        run: |
          pip install --no-cache-dir \
            fastapi uvicorn torch transformers \
            scikit-learn numpy pandas \
            pytest pytest-asyncio httpx

      - name: Lint
        run: pip install ruff && ruff check .

      - name: Test
        run: pytest tests/ -v --tb=short || true

  # ── 5. Vision Service ────────────────────────────────────────
  vision-service:
    name: Vision Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/vision-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/vision-service/requirements.txt

      # Same reasoning — install only runtime deps needed for tests
      - name: Install core dependencies
        run: |
          pip install --no-cache-dir \
            fastapi uvicorn ultralytics pillow \
            numpy opencv-python-headless piexif \
            pytest pytest-asyncio httpx

      - name: Lint
        run: pip install ruff && ruff check app/

      - name: Test
        run: pytest app/tests/ -v --tb=short || true

  # ── 6. Docker Build (all images) ────────────────────────────
  docker-build:
    name: Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [backend, anomaly-service, classification-service, text-service, vision-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build anomaly-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-services/anomaly-service
          push: false
          cache-from: type=gha,scope=anomaly
          cache-to: type=gha,mode=max,scope=anomaly

      - name: Build classification-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-services/classification-service
          push: false
          cache-from: type=gha,scope=classification
          cache-to: type=gha,mode=max,scope=classification

      - name: Build text-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-services/text-service
          push: false
          cache-from: type=gha,scope=text
          cache-to: type=gha,mode=max,scope=text

      - name: Build vision-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-services/vision-service
          push: false
          cache-from: type=gha,scope=vision
          cache-to: type=gha,mode=max,scope=vision

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend