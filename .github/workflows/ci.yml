name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1. NestJS Backend ────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taamine
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: taamine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taamine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taamine:secret@localhost:5432/taamine

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://taamine:secret@localhost:5432/taamine
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: taamine
          NODE_ENV: test

  # ── 2. Anomaly Service ───────────────────────────────────────
  anomaly-service:
    name: Anomaly Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/anomaly-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          REQ=$(find . -name requirements.txt | head -1)
          echo "Using $REQ"
          pip install --no-cache-dir -r "$REQ"

      - name: Lint
        run: pip install ruff && ruff check app/ --exit-zero

      - name: Test
        run: pytest tests/ -v --tb=short || true

  # ── 3. Classification Service ────────────────────────────────
  classification-service:
    name: Classification Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/classification-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/classification-service/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint
        run: pip install ruff && ruff check app/ --exit-zero

      - name: Test
        run: pytest app/tests/ -v --tb=short || true

  # ── 4. Text / NLP Service ────────────────────────────────────
  text-service:
    name: Text Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/text-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          pip install --no-cache-dir \
            fastapi uvicorn torch transformers \
            scikit-learn numpy pandas \
            pytest pytest-asyncio httpx

      - name: Lint
        run: pip install ruff && ruff check . --exit-zero

      - name: Test
        run: pytest tests/ -v --tb=short || true

  # ── 5. Vision Service ────────────────────────────────────────
  vision-service:
    name: Vision Service — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-services/vision-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          pip install --no-cache-dir \
            fastapi uvicorn ultralytics pillow \
            numpy opencv-python-headless piexif \
            pytest pytest-asyncio httpx

      - name: Lint
        run: pip install ruff && ruff check app/ --exit-zero

      - name: Test
        run: pytest tests/ -v --tb=short || true