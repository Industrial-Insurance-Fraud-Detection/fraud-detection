services:

  # ── Infrastructure ───────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: taamine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taamine
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: taamine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taamine']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taamine_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: taamine_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: taamine_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: taamine_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - '5678:5678'

  # ── NestJS Backend ───────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taamine_backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── AI Microservices ─────────────────────────────────────────

  anomaly-service:
    build:
      context: ./ai-services/anomaly-service
      dockerfile: Dockerfile
    container_name: taamine_anomaly
    restart: unless-stopped
    ports:
      - '8001:8001'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  classification-service:
    build:
      context: ./ai-services/classification-service
      dockerfile: Dockerfile
    container_name: taamine_classification
    restart: unless-stopped
    ports:
      - '8002:8002'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  text-service:
    build:
      context: ./ai-services/text-service
      dockerfile: Dockerfile
    container_name: taamine_text
    restart: unless-stopped
    ports:
      - '8003:8003'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  vision-service:
    build:
      context: ./ai-services/vision-service
      dockerfile: Dockerfile
    container_name: taamine_vision
    restart: unless-stopped
    ports:
      - '8004:8004'
    volumes:
      # Mount your trained YOLOv8 weights here
      - ./ai-services/vision-service/app/models:/service/app/models
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # ── React Frontend ───────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taamine_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  n8n_data: